ke="#526879" stroke-width="2" fill="none" stroke-dasharray="7,5" marker-end="url(#arrow)"/><text x="1070" y="653" font-family="Arial" font-size="16" fill="#243b53">extend</text><path d="M340 290 V640 H850 V535 H870" stroke="#526879" stroke-width="2" fill="none"  /><text x="420" y="635" font-family="Arial" font-size="16" fill="#243b53">Администратор: все отчеты и оценки</text><circle cx="145" cy="73" r="14" fill="white" stroke="#243b53" stroke-width="2"/><path d="M145 87 v35 m-30 -22 h60 m-30 22 l-24 23 m24 -23 l24 23" fill="none" stroke="#243b53" stroke-width="2"/><text x="42" y="164" font-family="Arial" font-size="20">Администратор</text><circle cx="145" cy="293" r="14" fill="white" stroke="#243b53" stroke-width="2"/><path d="M145 307 v35 m-30 -22 h60 m-30 22 l-24 23 m24 -23 l24 23" fill="none" stroke="#243b53" stroke-width="2"/><text x="42" y="384" font-family="Arial" font-size="20">Деканат</text><circle cx="145" cy="513" r="14" fill="white" stroke="#243b53" stroke-width="2"/><path d="M145 527 v35 m-30 -22 h60 m-30 22 l-24 23 m24 -23 l24 23" fill="none" stroke="#243b53" stroke-width="2"/><text x="42" y="604" font-family="Arial" font-size="20">Преподаватель</text><circle cx="145" cy="733" r="14" fill="white" stroke="#243b53" stroke-width="2"/><path d="M145 747 v35 m-30 -22 h60 m-30 22 l-24 23 m24 -23 l24 23" fill="none" stroke="#243b53" stroke-width="2"/><text x="42" y="824" font-family="Arial" font-size="20">Студент</text><rect x="400" y="25" width="370" height="90" rx="90" fill="white" stroke="#243b53" stroke-width="2"/><text x="585" text-anchor="middle" y="64" font-family="Arial" font-size="19" font-weight="bold" fill="#172c40">Управление пользователями</text><text x="585" text-anchor="middle" y="87" font-family="Arial" font-size="16" font-weight="normal" fill="#172c40">Роли и активность</text><rect x="870" y="25" width="365" height="90" rx="90" fill="white" stroke="#243b53" stroke-width="2"/><text x="1052.5" text-anchor="middle" y="64" font-family="Arial" font-