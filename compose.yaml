services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: progress
      POSTGRES_USER: progress
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Скопируйте .env.example в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U progress -d progress"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    environment:
      DATABASE_URL: postgresql://progress:${POSTGRES_PASSWORD}@db:5432/progress
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  pgdata:
